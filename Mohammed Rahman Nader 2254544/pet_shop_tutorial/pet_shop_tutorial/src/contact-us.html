<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Pete's Pet Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #fff8dc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
    }
    h1 {
      color: #3366cc;
      font-weight: 700;
      margin-bottom: 2rem;
    }
    form {
      background: #ffffff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }
    label {
      font-size: 1.2rem;
      margin-top: 1rem;
    }
    input, textarea {
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
    }
    button {
      background-color: #4CAF50 !important;
      color: white !important;
      border: none;
      padding: 10px 20px;
      font-size: 1.1rem;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049 !important;
    }
  </style>
</head>
<body>

<div class="container text-center">
  <h1>📬 Contact Us</h1>
  <p style="font-size: 18px;">Have a question or want to give feedback? We'd love to hear from you!</p>

<!-- Custom feedback modal -->
<div id="feedbackModal" style="display: none; position: fixed; top: 0; left: 0; 
  width: 100%; height: 100%; background: rgba(0,0,0,0.6); 
  justify-content: center; align-items: center; z-index: 9999;">
  <div style="background: white; padding: 30px 40px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
    <p style="font-size: 18px; margin-bottom: 20px;">Thanks for your feedback! 🐾<br>We'll get back to you soon.</p>
    <button id="closeModal" style="padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;">OK</button>
  </div>
</div>

  <form id="contactForm">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" class="form-control" placeholder="Your Name" required/>
    </div>

    <div class="form-group">
      <label for="email">Email (optional)</label>
      <input type="email" id="email" class="form-control" placeholder="Your Email"/>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" class="form-control" rows="5" placeholder="Type your message here..." required></textarea>
    </div>

    <button type="submit">Send Message</button>
  </form>
</div>

<script>
  // JavaScript to run form submission
  document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault(); // prevent page reload

    // Show the custom modal
    document.getElementById("feedbackModal").style.display = "flex";

    // Reset the form
    this.reset();
  });

  // Close modal button
  document.getElementById("closeModal").addEventListener("click", function() {
    document.getElementById("feedbackModal").style.display = "none";
  });
</script>

</body>
</html>
